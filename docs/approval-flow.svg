<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" role="img" aria-label="A daemon acts only on an approval signed for the exact call" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A daemon acts only on an approval signed for the exact call</title><style>
svg{--bg:#ffffff;--cds-chart-axis:#8a8f98;--cds-chart-grid:#d6d8dc;--cds-chart-categorical-1:#2f6fd8;--cds-chart-reference-tint:#f3f4f6;--cds-text-primary:#1d1f23;--cds-text-secondary:#5f6670;font-family:Inter,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--cds-chart-axis:#8b949e;--cds-chart-grid:#30363d;--cds-chart-categorical-1:#58a6ff;--cds-chart-reference-tint:#161b22;--cds-text-primary:#e6edf3;--cds-text-secondary:#9da7b3}}</style><rect width="100%" height="100%" rx="12" style="fill:var(--bg)"/><defs><marker id="appr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">A daemon acts only on an approval signed for the exact call</text><g fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><path d="M180 100H208" marker-end="url(#appr-arrow)"></path><path d="M368 100H412" marker-end="url(#appr-arrow)"></path><path d="M540 100H572" marker-end="url(#appr-arrow)"></path><path d="M476 140V192" marker-end="url(#appr-arrow)"></path><path d="M396 220H368" marker-end="url(#appr-arrow)"></path><path d="M208 220H180" marker-end="url(#appr-arrow)"></path><path d="M100 248V312" marker-end="url(#appr-arrow)"></path><path d="M180 340H208" marker-end="url(#appr-arrow)"></path><path d="M368 340H572" marker-end="url(#appr-arrow)"></path></g><g><rect x="20" y="72" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text x="100" text-anchor="middle" style="fill:var(--cds-text-primary)"><tspan x="100" y="97">Agent asks to run</tspan><tspan x="100" y="113">a tool call</tspan></text></g><g><rect x="208" y="72" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text x="288" text-anchor="middle" style="fill:var(--cds-text-primary)"><tspan x="288" y="97">Daemon checks its</tspan><tspan x="288" y="113">local rules</tspan></text></g><g><polygon points="412,100 476,60 540,100 476,140" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></polygon><text x="476" y="104" text-anchor="middle" style="fill:var(--cds-text-primary)">Rule settles it?</text></g><g><rect x="572" y="72" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text x="652" text-anchor="middle" style="fill:var(--cds-text-primary)"><tspan x="652" y="97">Applied at once,</tspan><tspan x="652" y="113">no person needed</tspan></text></g><g><rect x="396" y="192" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text x="476" text-anchor="middle" style="fill:var(--cds-text-primary)"><tspan x="476" y="217">Flare goes up and</tspan><tspan x="476" y="233">a push is sent</tspan></text></g><g><rect x="208" y="192" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text x="288" text-anchor="middle" style="fill:var(--cds-text-primary)"><tspan x="288" y="217">Approver signs the</tspan><tspan x="288" y="233">call with its key</tspan></text></g><g><rect x="20" y="192" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text x="100" text-anchor="middle" style="fill:var(--cds-text-primary)"><tspan x="100" y="217">Citadel relays the</tspan><tspan x="100" y="233">signed command</tspan></text></g><g><rect x="20" y="312" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text x="100" text-anchor="middle" style="fill:var(--cds-text-primary)"><tspan x="100" y="337">Daemon verifies the</tspan><tspan x="100" y="353">signature and state</tspan></text><text x="100" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)"><tspan x="100" y="388">Bad signature or already</tspan><tspan x="100" y="404">decided: rejected</tspan></text></g><g><rect x="208" y="312" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text x="288" text-anchor="middle" style="fill:var(--cds-text-primary)"><tspan x="288" y="337">Decision recorded</tspan><tspan x="288" y="353">as an event</tspan></text></g><g><rect x="572" y="312" width="160" height="56" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></rect><text x="652" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)"><tspan x="652" y="337">Agent resumes</tspan><tspan x="652" y="353">or stops</tspan></text></g><text x="556" y="92" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">yes</text><text x="486" y="170" font-size="11.5" style="fill:var(--cds-text-secondary)">no</text><text x="194" y="304" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">valid and pending</text></svg>
