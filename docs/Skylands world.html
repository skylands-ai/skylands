<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skylands world</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Sora:wght@700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#E6EDF4; --surface:#FFFFFF; --surface-2:#F0F4F8; --line:#D2DCE6; --text:#13202E; --muted:#4D6276;
  --accent:#2D5BC7; --accent-bg:#E3EBFB; --chip:rgba(255,255,255,0.92); --chip-line:#C3D0DC;
  --flare:#FFD54A; --flare-ink:#1A1708; --ok:#2E9E57; --bad:#D9483B; --warn:#8A6400; --idle:#6B7F92; --info:#2D5BC7;
  --sky-top:#5C9BE0; --sky-horizon:#D6E9F7; --fog:#D6E9F7; --cloud:#FFFFFF; --hemi-sky:#D7EAFF; --hemi-ground:#7C8A66;
  --hemi-int:0.95; --sun:#FFF3DF; --sun-int:0.95; --stars:0; --tether:#5C86B8; --spark:#1FA6C8; --spark-add:0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101B27; --surface:#172636; --surface-2:#1D3043; --line:#2E4459; --text:#E7EEF4; --muted:#9DB0C2;
    --accent:#8DA9FF; --accent-bg:#22385A; --chip:rgba(16,27,39,0.9); --chip-line:#31475D;
    --ok:#6FD08C; --bad:#FF7A6E; --warn:#FFD54A; --idle:#9DB0C2; --info:#8DA9FF;
    --sky-top:#0A1424; --sky-horizon:#2A405E; --fog:#1E3049; --cloud:#40597C; --hemi-sky:#7D93BC; --hemi-ground:#262B36;
    --hemi-int:0.62; --sun:#FFB98A; --sun-int:0.6; --stars:0.9; --tether:#6A8FB8; --spark:#A9E8F5; --spark-add:1;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101B27; --surface:#172636; --surface-2:#1D3043; --line:#2E4459; --text:#E7EEF4; --muted:#9DB0C2;
  --accent:#8DA9FF; --accent-bg:#22385A; --chip:rgba(16,27,39,0.9); --chip-line:#31475D;
  --ok:#6FD08C; --bad:#FF7A6E; --warn:#FFD54A; --idle:#9DB0C2; --info:#8DA9FF;
  --sky-top:#0A1424; --sky-horizon:#2A405E; --fog:#1E3049; --cloud:#40597C; --hemi-sky:#7D93BC; --hemi-ground:#262B36;
  --hemi-int:0.62; --sun:#FFB98A; --sun-int:0.6; --stars:0.9; --tether:#6A8FB8; --spark:#A9E8F5; --spark-add:1;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:Barlow,"Helvetica Neue",Arial,sans-serif; font-size:14px; line-height:1.4; }
*,*::before,*::after{ box-sizing:border-box; }
button{ font:inherit; color:inherit; cursor:pointer; }
[hidden]{ display:none !important; }
.cmdbar{ position:absolute; left:50%; bottom:12px; transform:translateX(-50%); width:min(880px, calc(100% - 24px)); display:flex; flex-direction:column; gap:8px; padding:10px; border-radius:12px; background:var(--chip); border:1px solid var(--chip-line); box-shadow:0 6px 24px rgba(0,0,0,0.18); }
.cmdrow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.scope{ display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 6px 0 12px; border-radius:8px; border:2px solid var(--accent); background:var(--accent-bg); font-size:13px; font-weight:600; }
.scope select{ min-height:40px; max-width:280px; border:none; background:transparent; color:var(--text); font:inherit; font-weight:600; }
.scope-to{ padding-right:8px; }
#cmdInput{ flex:1 1 260px; min-width:0; min-height:44px; padding:0 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; font-size:15px; }
#cmdInput:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.why{ font-size:12px; color:var(--muted); margin-right:auto; }
.chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.chip select{ min-height:32px; padding:0 6px; border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; font-size:13px; }
.chip.file{ padding:4px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--text); }
.preview{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 10px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); font-size:13px; }
.preview .acts{ margin-left:auto; display:flex; gap:6px; }
button:focus-visible,a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.app{ height:100%; display:flex; flex-direction:column; }
.bar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--line); }
.brand{ display:flex; align-items:center; gap:8px; font-family:Sora,"Helvetica Neue",Arial,sans-serif; font-size:18px; font-weight:700; letter-spacing:-0.01em; }
.crumbs{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.crumbs .sep{ color:var(--idle); }
.btn{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); font-weight:600; }
.btn.small{ min-height:36px; padding:0 12px; font-size:13px; }
.btn.primary{ background:var(--flare); border-color:var(--flare); color:var(--flare-ink); }
.btn.ghost{ background:transparent; }
.muted{ color:var(--muted); }
.spacer{ flex:1 1 0; }
.meter{ display:flex; flex-direction:column; gap:4px; min-width:160px; font-size:12px; }
.meter .track{ height:6px; border-radius:3px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; }
.meter .fill{ height:100%; width:59%; background:var(--accent); }
.flarebtn{ display:inline-flex; align-items:center; gap:10px; min-height:44px; padding:0 12px; border-radius:8px; background:var(--surface-2); border:1px solid var(--flare); font-weight:600; }
.badge{ display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--flare); color:var(--flare-ink); font-size:12px; font-weight:700; }
.kbd{ font-size:11px; padding:1px 6px; border-radius:4px; border:1px solid var(--line); color:var(--muted); }
.main{ flex:1 1 auto; min-height:0; display:flex; }
.stage{ position:relative; flex:1 1 auto; min-width:0; overflow:hidden; background:var(--sky-horizon); }
#world{ display:block; width:100%; height:100%; touch-action:none; outline:none; }
.labels{ position:absolute; inset:0; pointer-events:none; }
.label{ position:absolute; left:0; top:0; pointer-events:auto; display:flex; flex-direction:column; align-items:flex-start; gap:2px; min-height:44px; padding:6px 10px; border-radius:8px; background:var(--chip); border:1px solid var(--chip-line); text-align:left; white-space:nowrap; transform:translate(-9999px,-9999px); }
.label[aria-pressed="true"]{ border-color:var(--text); box-shadow:0 0 0 2px var(--chip-line); }
.label .nm{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; }
.label .st{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; flex:none; }
.hud{ position:absolute; top:12px; left:12px; max-width:calc(50% - 24px); display:flex; flex-wrap:wrap; gap:8px; align-items:center; pointer-events:none; }
.hud > *{ pointer-events:auto; }
.chipnote{ padding:8px 12px; border-radius:8px; background:var(--chip); border:1px solid var(--chip-line); font-size:12px; color:var(--muted); }
.legend{ position:absolute; right:12px; top:12px; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; max-width:min(460px, calc(50% - 24px)); padding:8px 12px; border-radius:10px; background:var(--chip); border:1px solid var(--chip-line); font-size:12px; color:var(--muted); }
.legend span{ display:inline-flex; align-items:center; gap:6px; }
.nogl{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; color:var(--text); }
.panel{ width:360px; flex:none; overflow-y:auto; background:var(--surface); border-left:1px solid var(--line); padding:16px 18px 24px; display:flex; flex-direction:column; gap:18px; }
.ph{ display:flex; gap:12px; align-items:flex-start; }
.ph h2{ margin:0; font-size:22px; line-height:1.1; }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-size:12px; font-weight:600; }
.note{ margin:0; padding:10px 12px; border-radius:8px; background:var(--surface-2); font-size:13px; }
.facts{ display:flex; flex-direction:column; }
.fact{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
.fact b{ font-weight:600; text-align:right; }
.sec{ display:flex; flex-direction:column; gap:8px; }
.sec h3{ margin:0; font-size:13px; font-weight:600; color:var(--muted); }
.row{ display:flex; align-items:center; gap:10px; min-height:44px; padding:8px 10px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); }
.row .grow{ display:flex; flex-direction:column; flex:1; min-width:0; }
.row .sub{ font-size:12px; color:var(--muted); }
.row .acts{ display:flex; gap:6px; flex-wrap:wrap; }
.crew{ display:flex; flex-wrap:wrap; gap:8px; }
.crew span{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-size:13px; }
.seg{ display:flex; flex-wrap:wrap; gap:6px; }
.seg button{ min-height:36px; padding:0 12px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); font-size:13px; font-weight:600; }
.seg button[aria-pressed="true"]{ background:var(--accent-bg); border-color:var(--accent); }
code{ font-family:"JetBrains Mono",ui-monospace,monospace; font-size:12px; }
.code{ display:block; padding:8px 10px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); word-break:break-all; }
.tag{ position:absolute; left:0; top:0; pointer-events:auto; display:flex; flex-direction:column; align-items:flex-start; gap:1px; max-width:230px; min-height:36px; padding:4px 9px; border-radius:7px; background:var(--chip); border:1px solid var(--chip-line); font-size:11px; line-height:1.3; text-align:left; white-space:nowrap; transform:translate(-9999px,-9999px); }
.tag b{ font-size:12px; }
.tag span{ max-width:210px; overflow:hidden; text-overflow:ellipsis; color:var(--muted); }
.tag.waiting{ border:2px solid #E0B000; }
.tag.error{ border:2px solid var(--bad); }
.tag.sel{ box-shadow:0 0 0 2px var(--text); }
.ftag{ position:absolute; left:0; top:0; pointer-events:none; padding:2px 6px; border-radius:4px; background:var(--chip); border:1px solid var(--chip-line); font-family:"JetBrains Mono",ui-monospace,monospace; font-size:10.5px; white-space:nowrap; transform:translate(-9999px,-9999px); }
.ftag.edit{ border-color:#C98A1E; }
.ftag.read{ border-color:var(--info); }
.ftag.conflict{ border-color:var(--bad); color:var(--bad); font-weight:600; }
.feed{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:12.5px; }
.feed li{ display:flex; gap:10px; align-items:baseline; }
.feed time{ flex:none; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11px; color:var(--muted); }
.feed li span{ min-width:0; overflow-wrap:anywhere; }
.feed li.bad span{ color:var(--bad); }
.feed li.warn span{ color:var(--warn); }
.feed li.info span{ color:var(--info); }
.plan{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:13px; }
.plan li{ display:flex; gap:8px; }
.plan li.done{ color:var(--muted); }
.gauge{ height:8px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; }
button.row{ color:inherit; font:inherit; }
@media (max-width: 860px){
  .legend{ display:none; }
  .hud{ max-width:calc(100% - 24px); }
  .main{ flex-direction:column; overflow-y:auto; }
  .stage{ flex:none; height:440px; }
  .panel{ width:auto; overflow:visible; border-left:none; border-top:1px solid var(--line); }
  .hint{ display:none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg width="34" height="34" viewBox="10 4 200 200" aria-hidden="true"><polygon points="36,95 60,105 66,142 54,128 44,112" fill="#9A7656"/><polygon points="60,105 100,110 102,176 92,166 80,156 66,142" fill="#7C5D44"/><polygon points="100,110 136,107 124,152 112,164 102,176" fill="#614836"/><polygon points="136,107 164,93 158,108 148,124 136,138 124,152" fill="#4B382B"/><path d="M36,86 C34,96 64,101 100,101 C136,101 166,94 164,84 L164,93 C164,103 136,110 100,110 C64,110 36,104 36,95 Z" fill="#8A6542"/><path d="M36,86 C40,74 70,68 100,69 C130,68 160,73 164,84 C166,94 136,101 100,101 C64,101 34,96 36,86 Z" fill="#6CB35A"/><path d="M50,82 C60,75 84,72 100,72 C120,72 144,75 152,82 C130,78 70,78 50,82 Z" fill="#86C76F"/><polygon points="54,80 61,92 47,92" fill="#2F6B3A"/><polygon points="66,74 72,86 60,86" fill="#3C7D43"/><rect x="110" y="74" width="9" height="12" fill="#EFE9D8"/><rect x="121" y="68" width="8" height="18" fill="#E2DBC7"/><rect x="131" y="77" width="8" height="9" fill="#EFE9D8"/><circle cx="102" cy="187" r="12" fill="#7FE0F0" opacity="0.35"/><polygon points="102,179 108,187 102,197 96,187" fill="#5FD3E6"/><polygon points="102,179 108,187 102,187" fill="#BDF3FA"/><path d="M150 14 Q153 31 170 34 Q153 37 150 54 Q147 37 130 34 Q147 31 150 14 Z" fill="#F5B014"/><path d="M175 51 Q176.4 58.6 184 60 Q176.4 61.4 175 69 Q173.6 61.4 166 60 Q173.6 58.6 175 51 Z" fill="#F5B014"/><path d="M124 11 Q124.8 15.2 129 16 Q124.8 16.8 124 21 Q123.2 16.8 119 16 Q123.2 15.2 124 11 Z" fill="#F5B014"/></svg>
      <span>Skylands</span>
    </div>
    <nav class="crumbs" aria-label="Breadcrumb" id="crumbs"></nav>
    <span class="muted" id="connected"></span>
    <div class="spacer"></div>
    <div class="muted" style="font-size:12px">Spend rate <span style="font-size:15px;font-weight:600;color:var(--text)">$5.48/hr</span></div>
    <div class="meter">
      <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">Today</span><span><b>$23.60</b> of $40.00</span></div>
      <div class="track"><div class="fill"></div></div>
    </div>
    <button type="button" class="flarebtn" id="nextFlare"><span class="badge" id="flareCount">4</span><span>Next flare</span><span class="kbd">Space</span></button>
  </header>
  <main class="main">
    <section class="stage" id="stage" aria-label="3D world of every island">
      <canvas id="world" tabindex="0" role="img" aria-label="A 3D sky. The citadel floats at the center of the world, tethered to four host islands. Each island carries terraces for its repositories and airships for its agents."></canvas>
      <div class="labels" id="labels"></div>
      <div class="hud">
        <button type="button" class="btn" id="overview">Whole world</button>
        <span class="chipnote hint">Drag to orbit, scroll to zoom. Click to go deeper, double-click to jump in, Esc to go back up.</span>
      </div>
      <div class="cmdbar" id="cmdbar" role="group" aria-label="Command bar">
        <div class="cmdrow">
          <div class="scope"><span id="scopeLabel">Scope</span><select id="scopeSel" aria-label="Scope"></select><span class="scope-to" id="scopeTo" hidden></span></div>
          <input id="cmdInput" type="text" autocomplete="off" aria-label="Work order" placeholder="Describe work for any repo">
          <button type="button" class="btn primary" id="cmdGo">Preview</button>
        </div>
        <div class="cmdrow" id="chipRow">
          <span class="why" id="scopeWhy"></span>
          <span class="chip file" id="fileChip" hidden></span>
          <label class="chip">Model <select id="modelSel"></select></label>
          <label class="chip">Attempts <select id="attemptSel"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
          <label class="chip">Budget <select id="budgetSel"><option value="2">$2</option><option value="5" selected>$5</option><option value="10">$10</option><option value="20">$20</option></select></label>
        </div>
        <div class="preview" id="preview" hidden>
          <span id="previewText"></span>
          <span class="acts"><button type="button" class="btn small primary" id="launchBtn">Launch</button><button type="button" class="btn small ghost" id="editBtn">Edit</button></span>
        </div>
      </div>
      <div class="legend" aria-label="Legend">
        <span><svg width="26" height="8" viewBox="0 0 26 8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="var(--tether)" stroke-width="2.5"/><circle cx="8" cy="4" r="2" fill="var(--spark)"/><circle cx="18" cy="4" r="2" fill="var(--spark)"/></svg>Connected</span>
        <span><svg width="26" height="12" viewBox="0 0 26 12" aria-hidden="true"><path d="M1 2 Q13 18 25 2" fill="none" stroke="var(--idle)" stroke-width="2" stroke-dasharray="3 3"/></svg>Unreachable</span>
        <span><svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><line x1="5" y1="5" x2="5" y2="13" stroke="#E0B000" stroke-width="2.5" stroke-linecap="round"/><circle cx="5" cy="4" r="3" fill="#FFD54A"/></svg>Waiting on you</span>
        <span><svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><ellipse cx="11" cy="5" rx="9" ry="4" fill="var(--idle)"/><circle cx="7" cy="11" r="2" fill="#C8B48A"/><circle cx="11" cy="11.5" r="2" fill="#C8B48A"/><circle cx="15" cy="11" r="2" fill="#C8B48A"/></svg>Sandbags and low flight: fuller context</span>
        <span><span class="dot" style="background:#F2995E"></span>Claude <span class="dot" style="background:#3FBF9C"></span>Codex <span class="dot" style="background:#7C9BFF"></span>Gemini <span class="dot" style="background:#B58BEB"></span>Local</span>
      </div>
    </section>
    <aside class="panel" id="panel" aria-label="Selected island"></aside>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  function crenelRing(g, r, y, count, size) {

    }

  function crenelSquare(g, half, y, perSide, size) {

        var m = new THREE.Mesh(G.box, M.stoneTop);
        m.scale.set(size[0], size[1], size[2]);
        var x = side === 0 ? t : (side === 1 ? half : (side === 2 ? -t : -half));
        var z = side === 0 ? -half : (side === 1 ? t : (side === 2 ? half : -t));
        m.position.set(x, y + size[1] / 2, z);
        m.rotation.y = side % 2 ? Math.PI / 2 : 0;
        g.add(m);

    }

  function buildCitadel() {

    under.position.y = -1.6 - 6;

    // curtain wall: 18 straight segments with a walkway and merlons
    var WR = 7.4, WH = 2.4, SEG = 18;
    for (var s = 0; s < SEG; s++) {
      var a = ((s + 0.5) / SEG) * Math.PI * 2;

      seg.scale.set(2 * WR * Math.sin(Math.PI / SEG) + 0.05, WH, 0.8);

    gate.rotation.y = -ga + Math.PI / 2;

    // six flanking towers on the wall
    for (var k = 0; k < 6; k++) {
      var ta = (k / 6) * Math.PI * 2 + 0.26;
      var tw = new THREE.Group();
      tw.position.set(Math.cos(ta) * WR, 0, Math.sin(ta) * WR);

      body.position.y = 1.9;

    var KH = 7, KHALF = 3;

    g.add(keep);
    crenelSquare(g, KHALF, KH, 5, [0.55, 0.6, 0.35]);
    [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(function (c) {
      var tur = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.5, 1.8, 8), [M.stoneKeep, M.stoneTop, M.stoneKeep]);
      tur.position.set(c[0] * KHALF, KH - 0.2, c[1] * KHALF);
      g.add(tur);
      var tg = new THREE.Group();
      tg.position.set(c[0] * KHALF, KH + 0.7, c[1] * KHALF);

    g.add(topT);
    crenelSquare(g, THALF, KH + TH, 3, [0.45, 0.55, 0.3]);
    for (var tf = 0; tf < 4; tf++) {
      var tfa = tf * Math.PI / 2;
      slit(g, Math.sin(tfa) * (THALF + 0.03), KH + TH * 0.6, Math.cos(tfa) * (THALF + 0.03), tfa);
    }
    var top = KH + TH;

    halo.position.copy(beacon.position);

    var bl = new THREE.PointLight(0xFFD54A, 1.1, 30, 2);
    bl.position.copy(beacon.position);
    g.add(bl);

    var core = crystalAt(g, -1.6 - 12 - 1.8, 1.7);
    var ring = new THREE.Mesh(new THREE.TorusGeometry(10, 0.1, 6, 96), M.ring);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.1;
    ring.visible = false;
    g.add(ring);
    scene.add(g);
    pickRoots.push(g);

  document.getElementById('overview').addEventListener('click', overview);
  document.getElementById('nextFlare').addEventListener('click', nextFlare);
  window.addEventListener('keydown', function (e) {
    var tg = e.target;

  // ---------------------------------------------------------------- frame
  var tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
  function tubeAlong(curve, radius) { return new THREE.TubeGeometry(curve, 36, radius, 6, false); }
  function setGeo(mesh, geo) { if (mesh.geometry) mesh.geometry.dispose(); mesh.geometry = geo; }
  var frameNo = 0;
  var last = performance.now();

  function updateIslands(dt) {
    var k = reduceMotion ? 1 : Math.min(1, dt * 1.6);
    HOST_IDS.forEach(function (id) {
      var h = HOSTS[id], isl = islands[id];
      var up = reachable(id);
      if (S.drift[id] === undefined) S.drift[id] = 0;
      S.drift[id] += ((up ? 0 : 1) - S.drift[id]) * k;
      var d = S.drift[id];
      var dist = h.dist + 12 * d, y = h.y - 3 * d;
      var bob = reduceMotion ? 0 : Math.sin(time * 0.6 + h.phase) * 0.3;
      isl.pos.set(Math.cos(h.angle) * dist, y + bob, Math.sin(h.angle) * dist);
      isl.group.position.copy(isl.pos);
      isl.group.rotation.y = -h.angle + Math.PI / 2;
      // the crystal is the daemon as the citadel last heard it: lit while reachable, grey while it can't tell
      isl.core.mat.emissiveIntensity = up ? 1.1 : 0;
      isl.core.mat.color.set(up ? 0x7FE0F0 : 0x4A5866);
      isl.core.light.intensity = up ? 1.3 : 0;
      isl.core.mesh.rotation.y += dt * (up ? 0.8 : 0);
    });
    cit.core.mesh.rotation.y += dt * 0.5;
  }

  function updateTethers() {
    var end = cit.group.localToWorld(cit.core.local.clone());
    HOST_IDS.forEach(function (id) {
      var isl = islands[id], te = tethers[id];
      var start = isl.group.localToWorld(isl.core.local.clone());
      var mid = start.clone().add(end).multiplyScalar(0.5);
      var sag = 4 + 8 * S.drift[id];
      mid.y -= sag;
      te.curve = new THREE.QuadraticBezierCurve3(start, mid, end);
      var dead = false;
      var key = [start.x, start.y, start.z, sag].map(function (v) { return v.toFixed(1); }).join(',') + (dead ? 'd' : '');
      if (key !== te.key && frameNo % 2 === 0) {
        te.key = key;
        if (!dead) setGeo(te.tube, tubeAlong(te.curve, 0.12));
      }
      te.tube.visible = !dead;
      te.tube.material = reachable(id) ? tetherMat : slackMat;
      if (id === 'nc') {
        deadA.visible = dead;
        deadB.visible = dead;
        if (dead && frameNo % 6 === 0) {
          var dir = new THREE.Vector3(start.x - end.x, 0, start.z - end.z).normalize();
          setGeo(deadA, tubeAlong(new THREE.QuadraticBezierCurve3(end.clone(), end.clone().add(dir.clone().multiplyScalar(3)).add(new THREE.Vector3(0, -1.5, 0)), end.clone().add(dir.clone().multiplyScalar(4.5)).add(new THREE.Vector3(0, -6, 0))), 0.11));
          setGeo(deadB, tubeAlong(new THREE.QuadraticBezierCurve3(start.clone(), start.clone().add(dir.clone().multiplyScalar(-2)).add(new THREE.Vector3(0, -1.5, 0)), start.clone().add(dir.clone().multiplyScalar(-3)).add(new THREE.Vector3(0, -5.5, 0))), 0.11));
        }
      }
      var flowing = reachable(id);
      var fast = id === 'tr' && S.mode === 'syncing';
      var n = flowing ? (fast ? SPARKS : 10) : 0;
      var speed = fast ? 0.55 : 0.12;
      var arr = te.pts.geometry.attributes.position;
      for (var i = 0; i < SPARKS; i++) {
        if (i < n) {
          var u = reduceMotion ? i / n : (time * speed + i / n) % 1;
          te.curve.getPoint(u, tmpA);
          arr.setXYZ(i, tmpA.x, tmpA.y, tmpA.z);
        } else arr.setXYZ(i, 0, -9999, 0);
      }
      arr.needsUpdate = true;
      te.pts.material.size = fast ? 1.3 : 0.9;
    });
  }

  function pickNext(ag) {
    if (ag.cands.length < 2) return ag.cands[0];
    var n = ag.to, guard = 0;
    while (n === ag.to && guard++ < 8) n = ag.cands[Math.floor(ag.r() * ag.cands.length)];
    return n;
  }

  var MOVE = 3.0, LAND = 0.74;
  function altFor(ctx) { return 3.4 - 2.4 * Math.min(1, Math.max(0, ctx / 100)); }
  var effects = [];
  function compact(ag) {
    var before = Math.round(ag.ctx);
    ag.ctx = 38 + ag.r() * 12;
    ag.needsCompact = false;
    logEvent(ag, 'Compacted context from ' + before + '% to ' + Math.round(ag.ctx) + '% and climbed', null, 'decision');
    if (reduceMotion) return;
    var g = ag.isl.group, p = ag.mesh.position.clone();
    p.y -= 0.6;
    var puff = new THREE.Mesh(G.ball, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, depthWrite: false }));
    puff.position.copy(p);
    g.add(puff);
    effects.push({ mesh: puff, t: 0, kind: 'puff' });
    for (var i = 0; i < 3; i++) {
      var bag = new THREE.Mesh(G.bag, M.sand);
      bag.position.set(p.x + (i - 1) * 0.3, p.y, p.z);
      g.add(bag);
      effects.push({ mesh: bag, t: 0, kind: 'bag', vy: 0 });
    }
  }
  function updateEffects(dt) {
    for (var i = effects.length - 1; i >= 0; i--) {
      var e = effects[i];
      e.t += dt;
      var done = false;
      if (e.kind === 'puff') {
        e.mesh.scale.setScalar(1 + e.t * 4);
        e.mesh.material.opacity = Math.max(0, 0.6 * (1 - e.t / 1.2));
        done = e.t > 1.2;
      } else {
        e.vy -= 9.8 * dt;
        e.mesh.position.y += e.vy * dt;
        done = e.t > 2.2;
      }
      if (done) {
        if (e.mesh.parent) e.mesh.parent.remove(e.mesh);
        if (e.kind === 'puff') e.mesh.material.dispose();
        effects.splice(i, 1);
      }
    }
  }
  function easeIO(x) { return 0.5 - Math.cos(Math.PI * Math.min(1, Math.max(0, x))) / 2; }

  function updateAgents(dt) {
    agents.forEach(function (ag) {
      var blds = ag.terr.blds;
      ag.mesh.visible = blds.length > 0;
      if (!ag.mesh.visible) { ag.beam.visible = false; ag.top.visible = false; return; }
      if (!reachable(ag.def.host)) return;
      var adt = ag.def.host === 'tr' && S.mode === 'syncing' ? dt * 3 : dt;
      var bags = ag.mesh.userData.bags, nb = Math.min(4, Math.ceil(ag.ctx / 25));
      for (var bi = 0; bi < bags.length; bi++) bags[bi].visible = bi < nb;
      var bob = reduceMotion ? 0 : Math.sin(time * 1.8 + ag.bob) * 0.1;
      var q = agentQ(ag);
      if (q) {
        if (ag.dwellIdx !== null) { setDwell(ag, ag.dwellIdx, false); ag.dwellIdx = null; }
        var hb = blds[ag.hold];
        var hy = hb.userData.top + altFor(ag.ctx) + 0.5;
        ag.to = ag.hold;
        ag.mesh.position.set(hb.position.x, hy + bob, hb.position.z);
        ag.beam.visible = true;
        ag.top.visible = true;
        ag.beam.material = q.kind === 'error' ? M.beamBad : M.beam;
        ag.top.material = q.kind === 'error' ? M.beamTopBad : M.beamTop;
        ag.beam.position.set(hb.position.x, hy + 5.4, hb.position.z);
        ag.top.position.set(hb.position.x, hy + 10, hb.position.z);
        ag.top.scale.setScalar(reduceMotion ? 1 : 1 + 0.35 * Math.sin(time * 4 + ag.bob));
        return;
      }
      ag.beam.visible = false;
      ag.top.visible = false;
      if (!S.paused[ag.def.id]) {
        ag.t += adt;
        if (ag.phase === 'dwell') {
          if (ag.t > ag.dwellFor) {
            if (ag.dwellIdx !== null) { setDwell(ag, ag.dwellIdx, false); ag.dwellIdx = null; }
            ag.from = ag.to;
            if (ag.finishing) ag.returning = true; else ag.to = pickNext(ag);
            ag.phase = 'move';
            ag.t = 0;
          }
        } else {
          if (ag.needsCompact && ag.t > MOVE * 0.12) compact(ag);
          if (ag.t > MOVE) {
            if (ag.returning) { retireList.push(ag); return; }
            ag.launch = null;
            ag.phase = 'dwell';
            ag.t = 0;
            ag.dwellFor = 1.8 + ag.r() * 2.4;
            ag.act = ag.r() < 0.4 ? 'edit' : 'read';
            ag.dwellIdx = ag.to;
            setDwell(ag, ag.to, true);
            var f = blds[ag.to].userData.file;
            logEvent(ag, (ag.act === 'edit' ? (f.indexOf('reservations') >= 0 ? 'Write ' : 'Edit ') : 'Read ') + f, f, ag.act);
            ag.ctx = Math.min(99, ag.ctx + (ag.act === 'read' ? 2.6 : 1.8) + ag.r());
            if (ag.ctx >= 92) ag.needsCompact = true;
            var others = Object.keys(blds[ag.to].userData.dwell).filter(function (oid) { return oid !== ag.def.id && agentById[oid].def.session !== ag.def.session; });
            if (others.length) logEvent(ag, 'Overlaps with ' + agentById[others[0]].def.name + ' (' + agentById[others[0]].def.session + ') on ' + base(f), f, 'overlap');
            if (ag.def.orderId) orderArrived(ag);
          }
        }
      }
      var A = ag.launch || blds[ag.from], B = ag.returning ? ag.flagSpot : blds[ag.to];
      var roofA = A.userData.top + LAND, roofB = B.userData.top + LAND;
      if (ag.phase !== 'move') {
        // landed: sit on the roof, side by side if the roof is shared
        var ids = Object.keys(B.userData.dwell), n = ids.length, k = ids.indexOf(ag.def.id);
        var off = n > 1 && k >= 0 ? (k - (n - 1) / 2) * 0.6 : 0;
        ag.mesh.position.set(B.position.x + off, roofB, B.position.z);
      } else {
        var p = reduceMotion ? 1 : Math.min(1, ag.t / MOVE);
        var cruise = Math.max(A.userData.top, B.userData.top) + altFor(ag.ctx);
        var y;
        if (p < 0.25) y = roofA + (cruise - roofA) * easeIO(p / 0.25);
        else if (p > 0.75) y = cruise + (roofB - cruise) * easeIO((p - 0.75) / 0.25);
        else y = cruise;
        var h = p < 0.2 ? 0 : (p > 0.8 ? 1 : easeIO((p - 0.2) / 0.6));
        ag.mesh.position.set(A.position.x + (B.position.x - A.position.x) * h, y + (p > 0.2 && p < 0.8 ? bob : 0), A.position.z + (B.position.z - A.position.z) * h);
        var dx = B.position.x - A.position.x, dz = B.position.z - A.position.z;
        if (Math.abs(dx) + Math.abs(dz) > 0.01) ag.mesh.rotation.y = Math.atan2(-dz, dx);
      }
    });
    agents.forEach(function (ag) {
      if (!ag.leash) return;
      var par = agentById[ag.def.parent];
      var show = S.landed === ag.def.terrace && S.selected === ag.def.host && ag.mesh.visible && par.mesh.visible;
      ag.leash.visible = show;
      if (!show) return;
      var arr = ag.leash.geometry.attributes.position;
      arr.setXYZ(0, ag.mesh.position.x, ag.mesh.position.y - 0.4, ag.mesh.position.z);
      arr.setXYZ(1, par.mesh.position.x, par.mesh.position.y - 0.4, par.mesh.position.z);
      arr.needsUpdate = true;
    });
    flushRetired();
  }

  // ---------------------------------------------------------------- work orders and dispatch

    var text = cmdInput.value.trim();
    if (!text || !S.agent) return;
    var ag = agentById[S.agent];
    logEvent(ag, 'You: ' + text, null, 'decision');
    ag.def.plan.push([text, 0]);
    cmdInput.value = '';
    refreshAll();
  }
  function submitBar() {
    if (level() === 'agent') { sendMessage(); return; }
    if (previewBox.hidden) showPreview(); else launchOrder();
  }
  cmdInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submitBar(); }
    else if (e.key === 'Escape' && !previewBox.hidden) { e.preventDefault(); hidePreview(); }
  });
  cmdInput.addEventListener('input', function () { if (!previewBox.hidden) hidePreview(); updateBar(); });
  cmdGo.addEventListener('click', submitBar);
  document.getElementById('launchBtn').addEventListener('click', launchOrder);
  document.getElementById('editBtn').addEventListener('click', function () { hidePreview(); cmdInput.focus(); });
  // picking a scope in the bar moves the camera there, the same way clicking in the world sets the scope
  scopeSel.addEventListener('change', function () {
    var v = scopeSel.value;
    if (v === 'auto') { updateBar(); return; }
    if (v.indexOf('host:') === 0) select(v.slice(5));
    else { var r = repoByKey[v]; land(r.host, r.terrace); }
  });
  [modelSel, attemptSel, budgetSel].forEach(function (s) { s.addEventListener('change', updateBar); });

  function orderRows(list, showWhere) {
    return list.map(function (o) {
      var st = orderStatus(o);
      var where = o.repo ? o.repo + ' on ' + HOSTS[o.host].name : HOSTS[o.host].name + ', its daemon picks the repo';
      var models = o.models.length ? o.models.join(' and ') : 'model picked on placement';
      var notes = [];
      if (o.hostWhy) notes.push('the citadel picked ' + HOSTS[o.host].name + ' as ' + o.hostWhy);
      if (o.placedWhy) notes.push(o.placedWhy === 'you chose it' ? 'you picked the repo' : 'the daemon placed it: ' + o.placedWhy);
      var placed = notes.length ? ' (' + notes.join('; ') + ')' : '';
      return el('button', { type: 'button', class: 'row', style: 'text-align:left;width:100%', onclick: function () { if (o.terrace) land(o.host, o.terrace); else select(o.host); } }, [
        el('span', { class: 'dot', style: 'width:10px;height:10px;background:' + st[1] }),
        el('span', { class: 'grow' }, [
          el('span', { style: 'font-weight:600', text: 'Order ' + o.n + ': ' + o.text }),
          el('span', { class: 'sub', text: st[0] + ', ' + (showWhere || !o.repo ? where + ', ' : '') + models + placed })
        ])
      ]);
    });
  }

  var liveClock = 0;
  function frame(now) {
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    time += dt;
    frameNo++;
    var mode = laptopMode(time);
    if (mode !== S.mode) { if (mode === 'offline') S.lostAt.tr = time; S.mode = mode; refreshAll(); }
    updateIslands(dt);
    updateTethers();
    updateAgents(dt);
    updateOrders(dt);
    updateEffects(dt);
    if (S.agent) {
      var ag = agentById[S.agent];
      ag.mesh.getWorldPosition(tmpW);
      want.target.copy(tmpW);
    }
    var cycle = (time * 0.8) % 1;
    var any = pending().length > 0;
    cit.halo.visible = any;
    cit.halo.scale.setScalar(reduceMotion ? 1.6 : (1 + 0.6 * cycle) * 1.6);
    cit.halo.material.opacity = reduceMotion ? 0.3 : 0.45 * (1 - cycle);
    cit.light.intensity = any ? 1.1 : 0.4;
    if (!reduceMotion) puffs.rotation.y += dt * 0.01;
    updateCamera(reduceMotion ? 1 : Math.min(1, dt * 3));
    placeLabels();
    liveClock += dt;
    if (liveClock > 0.3) {
      liveClock = 0;
      if (S.landed) renderTags();
      if (liveUpdate) liveUpdate(time);
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  S.mode = laptopMode(0);
  refreshAll();
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
