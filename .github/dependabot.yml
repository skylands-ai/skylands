# Version updates, each Monday. Minor and patch updates come as one pull
# request per ecosystem, and a major update as its own. A version has to be a
# week old before it's proposed. Security updates aren't held back.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      go:
        patterns: ["*"]
        # acp-sdk is a 0.x module whose minor releases change its API, and
        # the daemon drives every agent through it, so it comes on its own.
        exclude-patterns: ["github.com/spachava753/acp-sdk"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies]
    # three stays on 0.128 until the world is moved to a newer three.js.
    ignore:
      - dependency-name: three
      - dependency-name: "@types/three"
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docsite
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      docsite:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
