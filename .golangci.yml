version: "2"

linters:
  settings:
    errcheck:
      # Writes to stdout and stderr from CLI output have nowhere to report a
      # failure, so checking them adds noise and no safety.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  # Code that gofmt would change fails lint, so it fails CI.
  enable:
    - gofmt
